version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: betmanager_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: betmanager_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:    ${DATABASE_URL}
      GROQ_API_KEY:    ${GROQ_API_KEY}
      GEMINI_API_KEY:  ${GEMINI_API_KEY}
      JWT_SECRET:      ${JWT_SECRET}
      JWT_EXPIRES:     ${JWT_EXPIRES}
      PORT:            3000
      APP_URL:         ${APP_URL}
      SMTP_HOST:       ${SMTP_HOST}
      SMTP_PORT:       ${SMTP_PORT}
      SMTP_USER:       ${SMTP_USER}
      SMTP_PASS:       ${SMTP_PASS}
      SMTP_FROM:       ${SMTP_FROM}
    # Roda migrations antes de subir o servidor
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    # Porta NÃO exposta publicamente — só acessível internamente pelo nginx
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: betmanager_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
