# Nginx do host — termina SSL e faz proxy para o container frontend (porta 80)
# Copiar para: /etc/nginx/sites-available/betmanager
# Ativar com: sudo ln -s /etc/nginx/sites-available/betmanager /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name betmanager.app.br www.betmanager.app.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name betmanager.app.br www.betmanager.app.br;

    ssl_certificate     /etc/letsencrypt/live/betmanager.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/betmanager.app.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Repassa tudo para o container frontend (que já tem nginx interno + proxy /api)
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
